# 異常値（Outlier）発掘クローラ MVP 用シードチャンネル一覧
#
# 指定形式:
#   - handle（例: "@easyactually"）または channel_id（例: "UC..."）のいずれか（または両方）を指定可能。
#   - channel_id を明記した場合は channels.list(id=...) を使用し、@handle のみ指定時は channels.list(forHandle=...) で自動解決して SQLite キャッシュに保存する。
#   - market: "global_en" | "jp"
#   - category: --category フィルタ用ラベル（海外ベンチマーク / 日本の教養・心理・経済解説系）
#   - format_plan: 対応する制作フォーマット（plan_c / plan_b / plan_e / plan_a / stickman_collage）

